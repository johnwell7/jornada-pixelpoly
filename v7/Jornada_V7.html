<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="theme-color" content="#231922">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jornada · O refúgio</title>
<style>
:root {
  color-scheme: dark;
  font-family: Georgia, serif;
  color: #f7dfb5;
  background: #231922;
}
* { box-sizing: border-box; }
body { margin: 0; }
main { position: relative; height: 100vh; height: 100dvh; overflow: hidden; background: #1b100e; }
canvas { display: block; position: absolute; image-rendering: pixelated; touch-action: none; }
header {
  position: absolute; width: 1px; height: 1px; padding: 0;
  clip-path: inset(50%); overflow: hidden; white-space: nowrap;
}
footer {
  position: absolute; inset: auto 0 0; padding: 12px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  pointer-events: none; text-align: center;
}
p { margin: 0; }
#hint { display: inline-block; background: #2b2029e8; padding: 5px 10px; font-size: .86rem; }
#hint[hidden] { display: none; }
button { font: inherit; color: inherit; padding: 7px 13px; border: 1px solid #aa7953; background: #38272e; }
button:hover, button:focus-visible { border-color: #f7dfb5; background: #533744; }
#invite { pointer-events: auto; min-height: 44px; font-size: .94rem; }
#pet {
  position: absolute; width: 44px; height: 44px; padding: 0;
  opacity: 0; pointer-events: none; transform: translate(-50%, -50%);
}
#pet:focus-visible { opacity: 1; outline: 2px solid #f7dfb5; background: #271b2340; }
#bubble {
  position: absolute; opacity: 0; transform: translate(-50%,-100%);
  width: max-content; max-width: 175px; padding: 6px 9px; color: #402a2b;
  background: #f3dcb1; border: 1px solid #604236; font-size: .88rem;
  transition: opacity .2s ease, translate .2s ease; translate: 0 3px; pointer-events: none;
}
#bubble[data-visible] { opacity: 1; translate: 0 0; }
@media (prefers-reduced-motion: reduce) { #bubble { transition: none; } }
</style>
<main>
  <canvas id="room" aria-label="Lar da ovelha em pixel art."></canvas>
  <header><h1>Jornada</h1></header>
  <button id="pet" type="button" aria-label="Fazer carinho na ovelha"></button>
  <p id="bubble" role="status" aria-live="polite"></p>
  <footer>
    <p id="hint">Toque na ovelha para fazer carinho.</p>
    <button id="invite" type="button" hidden></button>
  </footer>
</main>
<script type="module">
const world = { width: 448, height: 336 };
const floor = { x: 10, y: 177, w: 428, h: 150 };
const start = { x: 366, y: 300 };
const objects = [
  {id:'shelf',x:68,y:183,box:{x:25,y:151,w:87,h:32}},
  {id:'bench',x:213,y:182,box:{x:168,y:162,w:91,h:20}},
  {id:'bed',x:374,y:279,box:{x:318,y:171,w:118,h:108}},
  {id:'lantern',x:296,y:198,box:{x:275,y:165,w:44,h:33}},
  {id:'plant',x:136,y:231,box:{x:118,y:201,w:35,h:30}},
  {id:'chest',x:54,y:313,box:{x:24,y:280,w:60,h:33}}
];
const targets = {
  window:{x:219,y:197,face:'north',pose:'look'},
  bed:{x:367,y:300,face:'east',pose:'sit'},
  rug:{x:194,y:296,face:'south',pose:'sit'},
  plant:{x:174,y:225,face:'west',pose:'look'}
};

const radius = 6;
function walkable(x, y) {
  return x >= floor.x + radius && x <= floor.x + floor.w - radius &&
    y >= floor.y + radius && y <= floor.y + floor.h - radius &&
    !objects.some(({ box: b }) => x > b.x - radius && x < b.x + b.w + radius &&
      y > b.y - radius && y < b.y + b.h + radius);
}
function crossesBox(a, b, box) {
  let enter = 0;
  let exit = 1;
  for (const [origin, delta, low, high] of [
    [a.x, b.x-a.x, box.x-radius, box.x+box.w+radius],
    [a.y, b.y-a.y, box.y-radius, box.y+box.h+radius]
  ]) {
    if (delta === 0) {
      if (origin <= low || origin >= high) return false;
    } else {
      const from = (low-origin)/delta, to = (high-origin)/delta;
      enter = Math.max(enter, Math.min(from,to));
      exit = Math.min(exit, Math.max(from,to));
      if (enter >= exit) return false;
    }
  }
  return enter < exit;
}
function clearSegment(a,b) {
  return walkable(a.x,a.y) && walkable(b.x,b.y) &&
    !objects.some(({ box }) => crossesBox(a,b,box));
}

const grid = 8;
const columns = Math.floor(floor.w / grid) + 1;
const rows = Math.floor(floor.h / grid) + 1;
const point = id => ({ x: floor.x + id % columns * grid, y: floor.y + Math.floor(id / columns) * grid });
const nodes = Array.from({ length: columns * rows }, (_, id) => point(id));
const neighbours = [[1,0],[-1,0],[0,1],[0,-1]];
const distance = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

function nearestNode(p, connected) {
  let best = -1;
  let bestDistance = Infinity;
  nodes.forEach((node, id) => {
    const d = distance(p, node);
    if (d < bestDistance && walkable(node.x, node.y) && (!connected || clearSegment(p, node))) {
      best = id;
      bestDistance = d;
    }
  });
  return best;
}

function findPath(origin, destination) {
  if (clearSegment(origin, destination)) return [destination];
  const from = nearestNode(origin, true);
  const exact = walkable(destination.x, destination.y);
  const to = nearestNode(destination, exact);
  if (from < 0 || to < 0) return [];
  const previous = new Int32Array(nodes.length).fill(-1);
  const queue = [from];
  previous[from] = from;
  for (let cursor = 0; cursor < queue.length && previous[to] < 0; cursor++) {
    const id = queue[cursor];
    const col = id % columns;
    const row = Math.floor(id / columns);
    for (const [dx,dy] of neighbours) {
      const x = col + dx, y = row + dy;
      const next = y * columns + x;
      if (x < 0 || x >= columns || y < 0 || y >= rows || previous[next] >= 0) continue;
      if (!clearSegment(nodes[id], nodes[next])) continue;
      previous[next] = id;
      queue.push(next);
    }
  }
  if (previous[to] < 0) return [];
  const route = [];
  for (let id = to; id !== from; id = previous[id]) route.push(nodes[id]);
  route.push(nodes[from]);
  route.reverse();
  if (exact) route.push(destination);

  const path = [];
  let at = origin;
  for (let i = 0; i < route.length;) {
    let next = i;
    while (next + 1 < route.length && clearSegment(at, route[next + 1])) next++;
    at = route[next];
    path.push(at);
    i = next + 1;
  }
  return path;
}

function createLamb() {
  return { ...start, face: 'east', pose: 'idle', elapsed: 0, distance: 0, speed: 0, path: [], target: null };
}
function setPose(lamb, pose) {
  if (lamb.pose !== pose) {
    lamb.pose = pose;
    lamb.elapsed = 0;
    if (pose === 'walk') lamb.distance = 0;
  }
}
const crossingPoints = [{x:189,y:231},{x:241,y:223},{x:269,y:254},{x:276,y:276},{x:297,y:301},{x:167,y:259}];
function routeLength(origin, route) {
  return route.reduce((sum, point, i) => sum + distance(i ? route[i-1] : origin,point),0);
}
function alternateRoute(origin, destination, direct, random) {
  if (!direct.length || !random || random() >= .40) return direct;
  const length = routeLength(origin,direct);
  const start = Math.floor(random()*crossingPoints.length);
  for (let i=0; i<crossingPoints.length; i++) {
    const via = crossingPoints[(i+start)%crossingPoints.length];
    if (distance(origin,via)<15 || distance(via,destination)<15) continue;
    if (!clearSegment(origin,via) || !clearSegment(via,destination)) continue;
    const alternative = [via,destination], detour = routeLength(origin,alternative)-length;
    if (detour >= 4 && detour <= Math.min(29,length*.29)) return alternative;
  }
  return direct;
}

function go(lamb, destination, target = null, random) {
  lamb.speed = 0;
  lamb.path = alternateRoute(lamb,destination,findPath(lamb,destination),random);
  lamb.arrival = destination;
  lamb.target = lamb.path.length ? target : null;
  return lamb.path.length > 0;
}

function move(lamb, dx, dy) {
  if (Math.abs(dx) > Math.abs(dy) * 0.85) lamb.face = dx < 0 ? 'west' : 'east';
  else if (dy) lamb.face = dy < 0 ? 'north' : 'south';
  setPose(lamb, 'walk');
  lamb.distance += Math.hypot(dx, dy);
  lamb.x += dx;
  lamb.y += dy;
}

function step(lamb, dt, input = { x: 0, y: 0 }) {
  lamb.elapsed += dt;
  const budget = 70 * dt;
  if (input.x || input.y) {
    lamb.path = [];
    lamb.target = null;
    const length = Math.hypot(input.x, input.y);
    const dx = input.x * budget / length, dy = input.y * budget / length;
    const x = walkable(lamb.x + dx, lamb.y) ? dx : 0;
    const y = walkable(lamb.x + x, lamb.y + dy) ? dy : 0;
    if (x || y) move(lamb, x, y);
    else if (lamb.pose === 'walk') setPose(lamb, 'settle');
    return null;
  }

  if (lamb.path.length) {
    const remainingDistance = distance(lamb, lamb.path[0]) +
      lamb.path.slice(1).reduce((total, p, i) => total + distance(lamb.path[i], p), 0);
    const approachSpeed = Math.max(12, Math.sqrt(2 * 107 * remainingDistance));
    lamb.speed = Math.min(54, approachSpeed, lamb.speed + 107 * dt);
    let remaining = lamb.speed * dt;
    while (remaining > 0 && lamb.path.length) {
      const next = lamb.path[0];
      const d = distance(lamb, next);
      if (d > 0.0001) {
        const amount = Math.min(remaining, d);
        move(lamb, (next.x - lamb.x) / d * amount, (next.y - lamb.y) / d * amount);
        remaining -= amount;
      }
      if (d <= 0.0001 || distance(lamb, next) <= 0.0001) lamb.path.shift();
    }
    if (lamb.path.length) return null;
    lamb.speed = 0;
    const arrival = lamb.target;
    lamb.target = null;
    if (arrival) {
      lamb.face = lamb.arrival.face ?? lamb.face;
      setPose(lamb,lamb.arrival.pose ?? 'idle');
    } else setPose(lamb, 'settle');
    return arrival;
  }
  if (lamb.pose === 'walk') setPose(lamb, 'settle');
  if (lamb.pose === 'settle' && lamb.elapsed >= 0.15) setPose(lamb, 'idle');
  return null;
}

const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
function cameraViewport(width,height) {
  const mobile = height > width;
  if (mobile) {
    const scale = Math.max(1, Math.round(width/96), Math.ceil(height/world.height));
    return {width:Math.ceil(width/scale),height:Math.ceil(height/scale),scale,mobile};
  }
  const scale = Math.min(width/world.width,height/world.height);
  return {width:world.width,height:world.height,scale,mobile};
}

function follow(camera, lamb, view, dt, focus) {
  const mobile = view.mobile ?? view.width < 160;
  const margin = dt === Infinity ? 0 : mobile ? 5 : 12;
  const anchor = (current, ideal) => clamp(current, ideal-margin, ideal+margin);
  const xBias = mobile && focus ? clamp((focus.x-lamb.x)*.24,-12,12) : 0;
  const yBias = mobile && focus ? clamp((focus.y-lamb.y)*.18,-12,9) : 0;
  const lowPose = ['lie','sleep','stir'].includes(lamb.pose);
  const vertical = mobile ? lowPose ? .62 : .59 : view.width >= 320 ? .91 : .65;
  const x = clamp(anchor(camera.x,lamb.x+xBias-view.width/2),0,world.width-view.width);
  const y = clamp(anchor(camera.y,lamb.y+yBias-view.height*vertical),0,world.height-view.height);
  const amount = dt === Infinity ? 1 : 1 - Math.exp(-6 * dt);
  camera.x = clamp(camera.x + (x - camera.x) * amount, 0, world.width - view.width);
  camera.y = clamp(camera.y + (y - camera.y) * amount, 0, world.height - view.height);
}
function orderAt(y) {
  return [...objects, { id: 'lamb', y }].sort((a,b) => a.y - b.y).map(({ id }) => id);
}


const phase = (mode, pose, duration) => ({mode,pose,duration});
const activities = [
  {
    id:'window', location:{x:223,y:85}, approach:targets.window, interaction:'observe',
    invitation:'Observar a janela?', available:({sleepiness})=>sleepiness<.91,
    weight:({visits})=>visits ? 1.65 : 5.4,
    after:[phase('curious','look',[4,15])]
  },
  {
    id:'plant', location:{x:135,y:192}, approach:targets.plant, interaction:'inspect',
    available:({sleepiness})=>sleepiness<.86, weight:({distance})=>distance<70 ? 2.4 : 1.35,
    after:[phase('curious','look',[2.8,9])]
  },
  {
    id:'rug', location:{x:194,y:293}, approach:targets.rug, interaction:'settle',
    available:({distance,sleepiness})=>distance>17 && sleepiness<.95,
    weight:({sleepiness})=>1.1+sleepiness*.7, after:[phase('calm','sit',[5,18])]
  },
  {
    id:'bed', location:{x:374,y:216}, approach:targets.bed, interaction:'sleep',
    invitation:'Descansar perto da cama?', available:({sleepiness})=>sleepiness>=.46,
    weight:({sleepiness})=>1 + sleepiness**3*9,
    before:[{...phase('drowsy','yawn',[.95,2.5]),face:'east'}],
    after:[phase('settling','sit',[.65,2.2]),phase('lying','lie',[.6,.95]),
      phase('sleeping','sleep',[17,39]),phase('waking','wake',[.75,1.1]),phase('calm','sit',[2,11])]
  },
  {
    id:'pause', interaction:'rest',
    available:()=>true, weight:({sleepiness})=>sleepiness>.9 ? .65 : 2.25,
    after:[phase('calm','sit',[5,21])]
  },
  {
    id:'listen', interaction:'observe',
    available:({sleepiness})=>sleepiness<.93, weight:({sleepiness})=>1.5-sleepiness*.5,
    after:[phase('calm','idle',[3,11]),phase('playful','perk',[.7,2.8])]
  }
];


const range = (rng,min,max)=>min+rng()*(max-min);
const gap = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const indoors = ['calm','curious','playful','waking'];
const restingModes = ['lying','sleeping'];
const positionOf = ({x,y})=>({x,y});

function createBehavior(lamb, random = Math.random, {catalog = activities, observe} = {}) {
  let mode = 'calm', remaining = range(random,3,6), clock = 0, sinceSpoke = -Infinity;
  let sleepiness = range(random,.12,.26), temperament = range(random,.77,1.18);
  let active = null, phases = [], stop = null, invitation = null, interaction = null;
  let recentlyTouched = [], suggestionFor = null, latestContext = -Infinity;
  const recent = [], visits = new Map();
  setPose(lamb,'sit');

  function enter(next, pose, duration) {
    mode = next;
    remaining = duration;
    setPose(lamb,pose);
    observe?.({type:'phase',time:clock,id:active?.id,mode,duration});
  }

  function advance() {
    const phase = phases.shift();
    if (!phase) {
      if (active) observe?.({type:'finish',time:clock,id:active.id});
      active = null;
      choose();
      return;
    }
    if (!phase.travel) {
      if (phase.face) lamb.face = phase.face;
      enter(phase.mode,phase.pose,range(random,...phase.duration));
      return;
    }

    if (!go(lamb,active.approach,active.id,random)) {
      phases = [];
      enter('calm','sit',range(random,3,7));
      return;
    }
    const route = lamb.path.map(positionOf), from = positionOf(lamb);
    stop = gap(lamb,active.approach)>83 && sleepiness<.86 && random()<.22 ? clock+range(random,1.05,1.68) : null;
    observe?.({type:'travel',time:clock,id:active.id,from,route});
    mode = 'walking';
  }

  function context(activity) {
    return {
      sleepiness,
      distance:activity.approach ? gap(lamb,activity.approach) : 0,
      visits:visits.get(activity.id)??0
    };
  }
  function cadenceWeight(id) {
    const previous = recent.at(-1);
    const lastUse = recent.findLastIndex(entry=>entry.id===id);
    const age = lastUse<0 ? Infinity : clock-recent[lastUse].at;
    const recency = age < 12 ? .13 : age < 32 ? .39 : age < 60 ? .73 : 1;

    let repeatedLinks = 0, repeatedPhrase = false;
    for (let i=1;i<recent.length;i++) {
      if (recent[i-1].id!==previous?.id || recent[i].id!==id) continue;
      repeatedLinks++;
      if (i>1 && recent[i-2].id===recent.at(-2)?.id) repeatedPhrase = true;
    }
    return recency / (1+repeatedLinks*.46) * (repeatedPhrase ? .50 : 1);
  }
  function choose() {
    const choices = catalog.flatMap(activity=>{
      const current = context(activity);
      if (activity.available && !activity.available(current)) return [];
      const bias = activity.interaction==='inspect' || activity.interaction==='observe' ? temperament : 1;
      const boost = invitation?.id===activity.id && clock<=invitation.until ? 5.4 : 0;
      const restNeed = activity.interaction==='sleep' && sleepiness>.86 ? 3 : 1;
      const value = (activity.weight(current)*bias*cadenceWeight(activity.id)+boost)*restNeed;
      return [[activity,value]];
    });
    invitation = null;
    let roll = random()*choices.reduce((sum,[,weight])=>sum+weight,0);
    active = choices.find(([,weight])=>(roll-=weight)<0)?.[0] ?? choices.at(-1)?.[0];
    if (!active) {
      enter('calm','sit',range(random,5,10));
      return;
    }
    recent.push({id:active.id,at:clock});
    if (recent.length>10) recent.shift();
    visits.set(active.id,(visits.get(active.id)??0)+1);
    observe?.({type:'start',time:clock,id:active.id});
    phases = [...(active.before??[]),...(active.approach ? [{travel:true}] : []),...active.after];
    advance();
  }

  function update(dt) {
    clock+=dt;
    if (interaction) {
      interaction.remaining-=dt;
      lamb.elapsed+=dt;
      if (interaction.remaining<=0) {
        Object.assign(lamb,interaction.resume);
        interaction=null;
      }
      return;
    }
    const fatigue = mode==='sleeping' ? -.040 : mode==='walking' ? .028 : mode==='calm' ? .008 : .015;
    sleepiness=Math.max(0,Math.min(1,sleepiness+dt*fatigue*temperament));

    if (mode==='pauseWalk') {
      lamb.elapsed+=dt;
      remaining-=dt;
      if (remaining<=0) mode='walking';
      return;
    }
    const arrived=step(lamb,dt);
    if (mode==='walking') {
      if (arrived) {
        observe?.({type:'arrive',time:clock,id:arrived,at:positionOf(lamb)});
        stop=null;
        advance();
      } else if (stop!==null && clock>=stop && gap(lamb,active.approach)>28) {
        stop=null;
        lamb.speed=0;
        enter('pauseWalk','look',range(random,.6,2.0));
      }
      return;
    }
    remaining-=dt;
    if (remaining<=0) advance();
  }

  function pet(stroking = false) {
    recentlyTouched=recentlyTouched.filter(at=>clock-at<1.4);
    if (!stroking) recentlyTouched.push(clock);
    const bothered=recentlyTouched.length>=4;
    if (!interaction) {
      interaction={resume:{pose:lamb.pose,face:lamb.face,elapsed:lamb.elapsed},remaining:0};
      lamb.speed=0;
      observe?.({type:'pet',time:clock,id:active?.id,mode});
    }
    const resting=restingModes.includes(mode);
    if (!resting) lamb.face='south';
    setPose(lamb,resting ? 'stir' : bothered ? 'ruffled' : 'pet');
    interaction.remaining=bothered ? .8 : 1.05;
    if (stroking || clock-sinceSpoke<18 || !bothered && random()>.22) return '';
    sinceSpoke=clock;
    return bothered && !resting ? 'Ei… devagarinho.' : 'Mmé.';
  }

  function suggestion() {
    if (interaction || invitation || !indoors.includes(mode)) return null;
    if (clock-latestContext>.4) {
      latestContext=clock;
      const available=catalog.filter(activity=>activity.invitation && active?.id!==activity.id &&
        context(activity).distance<129 && activity.available(context(activity)));
      const choice=available.find(activity=>activity.interaction==='sleep')??available[0];
      suggestionFor=choice ? {id:choice.id,label:choice.invitation} : null;
    }
    return suggestionFor;
  }

  function invite(id) {
    if (!id || suggestion()?.id!==id) return false;
    invitation={id,until:clock+25};
    remaining=Math.min(remaining,range(random,1.8,3.6));
    return true;
  }

  return {update,pet,suggestion,invite,
    get mode(){return interaction ? 'interacting' : mode;},
    get focus(){return !interaction && (mode==='curious' || restingModes.includes(mode)) ? active?.location : null;}

  g.drawImage(image,0,0,world.width,world.height);
}

function drawScenery(g, id, image, time) {
  const points=masks[id];
  if (!points) return;
  const unit=world.width/referenceWidth;
  g.save();
  g.beginPath();
  points.forEach(([x,y],i)=>i===0?g.moveTo(x*unit,y*unit):g.lineTo(x*unit,y*unit));
  g.closePath();
  g.clip();
  drawRoom(g,image);
  g.restore();
  if (id==='lantern') {
    g.save();
    g.globalCompositeOperation='screen';
    g.globalAlpha=.12+.07*Math.sin(time*6);
    g.fillStyle='#ffb52b';
    g.fillRect(296,147,3,7);
    g.restore();
  }
}



const bitmapWidth=159, bitmapHeight=102, unit=448/1448;
const gait=[0,1,0,-1];
const onGrid=value=>Math.round(value*artDensity)/artDensity;
const lowPose=pose=>['lie','sleep','stir'].includes(pose);

function createSheet() {
  return loadArtImage(lambSource);
}

function lambBounds(lamb) {
  const resting=lowPose(lamb.pose);
  return { halfWidth:25, head:resting?24:34, foot:6 };
}

function lambShadow(g,lamb) {
  const x=Math.round(lamb.x),y=Math.round(lamb.y);
  g.save();
  g.globalAlpha=.33;
  g.fillStyle='#1a100b';
  g.fillRect(x-17,y-3,34,5);
  g.fillRect(x-12,y-5,24,8);
  g.restore();
}

function drawLamb(g,sheet,lamb) {
  const {face,pose,elapsed}=lamb;
  const walking=pose==='walk';
  const phase=Math.floor(lamb.distance/4)%4;
  const step=walking?gait[phase]:0;
  const resting=lowPose(pose);
  const rising=pose==='wake'||pose==='lie';
  const height=resting ? (pose==='lie'?Math.max(.70,1-elapsed*.50):.70) :
    rising ? Math.min(1,.70+elapsed*.55) : pose==='pet'||pose==='snuggle' ? .93 : 1;
  const breadth=(face==='north'||face==='south') ? .89 : 1;
  const bob=walking ? -Math.abs(step) : resting && Math.sin(elapsed*2.1)>.65 ? -.33 : 0;
  const facing=face==='west'||face==='north'?-1:1;
  const blink=pose==='pet'||pose==='sleep'||pose==='snuggle'||
    (!walking&&!resting&&elapsed%5.1>4.91);
  const x=onGrid(lamb.x),y=onGrid(lamb.y+bob);
  const dx=(sx)=>onGrid((sx-bitmapWidth/2)*unit*breadth);
  const dy=(sy)=>onGrid((sy-bitmapHeight)*unit*height);
  function crop(sx,sy,sw,sh,shift=0) {
    g.drawImage(sheet,sx,sy,sw,sh,dx(sx+shift),dy(sy),dx(sx+sw)-dx(sx),dy(sy+sh)-dy(sy));
  }
  g.save();
  g.translate(x,y);
  if(facing<0)g.scale(-1,1);
  if(walking) {
    crop(0,0,bitmapWidth,85);
    crop(0,85,72,17,step*4);
    crop(72,85,bitmapWidth-72,17,-step*4);
  } else {
    crop(0,0,bitmapWidth,bitmapHeight);
  }
  if (blink || pose==='yawn') {
    g.fillStyle='#6b4226';
    if (blink) {
      g.fillStyle='#d99e60';
      g.fillRect(dx(124),dy(29),3.5,3);
      g.fillStyle='#684229';
      g.fillRect(dx(124),dy(34),3,1);
    }
    if (pose==='yawn'&&elapsed>.30&&elapsed<1.24)g.fillRect(dx(142),dy(51),2.1,2);
  }
  g.restore();
}



const canvas = document.querySelector('#room');
const hint = document.querySelector('#hint');
const bubble = document.querySelector('#bubble');
const inviteButton = document.querySelector('#invite');
const petButton = document.querySelector('#pet');
const g = canvas.getContext('2d', { alpha: false });
let room, sheet;
try {
  [room,sheet]=await Promise.all([loadRoom(),createSheet()]);
} catch (error) {
  hint.textContent='Não foi possível carregar a arte do Lar.';
  throw error;
}
const lamb = createLamb();
const params = new URLSearchParams(location.search);
const observation = params.get('observe')==='1' ? [] : null;
const behavior = createBehavior(lamb,Math.random,{observe:observation ? event=>observation.push(event) : undefined});
const camera = { x:0, y:0 };
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const debug = params.get('debug')==='1';
let view, frameScale, layout, stroke, left, top;
let time = 0, bubbleUntil = 0, previous, invitationId = null;

function resize() {
  layout = canvas.parentElement.getBoundingClientRect();
  const { width,height } = layout;
  const next = cameraViewport(width,height);
  const reframe = !view || view.mobile!==next.mobile || view.scale!==next.scale;
  view = next;
  frameScale = view.scale;
  const canvasWidth = view.width*frameScale, canvasHeight = view.height*frameScale;
  left = Math.floor((width-canvasWidth)/2);
  top = Math.floor((height-canvasHeight)/2);
  canvas.width = view.width*artDensity;
  canvas.height = view.height*artDensity;
  canvas.style.width = canvasWidth+'px';
  canvas.style.height = canvasHeight+'px';
  canvas.style.left = left+'px';
  canvas.style.top = top+'px';
  g.setTransform(artDensity,0,0,artDensity,0,0);
  g.imageSmoothingEnabled = false;
  follow(camera,lamb,view,reframe ? Infinity : 0,behavior.focus);
}

function toWorld(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: Math.round(camera.x)+(event.clientX-rect.left)*view.width/rect.width,
    y: Math.round(camera.y)+(event.clientY-rect.top)*view.height/rect.height
  };
}
function touchesLamb(point) {
  const {halfWidth,head,foot}=lambBounds(lamb);
  return Math.abs(point.x-lamb.x)<=halfWidth && point.y>=lamb.y-head && point.y<=lamb.y+foot;
}
function giveAffection(stroking = false) {
  if (debug) return;
  hint.hidden = true;
  const line = behavior.pet(stroking);
  if (line) {
    bubble.textContent = line;
    bubble.toggleAttribute('data-visible', true);
    bubbleUntil = time+2.2;
  }
}
canvas.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.button !== 0) return;
  const point = toWorld(event);
  if (debug) {
    go(lamb,point);
  } else if (touchesLamb(point)) {
    stroke = { id:event.pointerId, x:event.clientX, y:event.clientY, time };
    canvas.setPointerCapture(event.pointerId);
    giveAffection();
  }
});
canvas.addEventListener('pointermove', event => {
  if (stroke?.id !== event.pointerId || time-stroke.time < .28 ||
    Math.hypot(event.clientX-stroke.x,event.clientY-stroke.y) < 8 ||
    !touchesLamb(toWorld(event))) return;
  stroke = { id:event.pointerId, x:event.clientX, y:event.clientY, time };
  giveAffection(true);
});
for (const name of ['pointerup','pointercancel','lostpointercapture']) {
  canvas.addEventListener(name,event => { if (stroke?.id === event.pointerId) stroke = null; });
}
petButton.addEventListener('click', () => giveAffection());
inviteButton.addEventListener('click', () => {
  if (behavior.invite(invitationId)) {
    hint.hidden = true;
    inviteButton.hidden = true;
  }
});
addEventListener('resize',resize);

function positionInterface() {
  const x = left+(Math.round(lamb.x)-Math.round(camera.x))*frameScale;
  const y = top+(Math.round(lamb.y)-Math.round(camera.y))*frameScale;
  petButton.style.left = x+'px';
  petButton.style.top = y-14*frameScale+'px';
  if (bubbleUntil) {
    bubble.style.left = Math.max(60,Math.min(layout.width-60,x))+'px';
    bubble.style.top = Math.max(66,y-36*frameScale)+'px';
    if (time >= bubbleUntil) {
      bubble.toggleAttribute('data-visible',false);
      bubbleUntil = 0;
    }
  }
  if (time > 11) hint.hidden = true;
  const suggestion = hint.hidden && !debug ? behavior.suggestion() : null;
  if (suggestion?.id !== invitationId || suggestion === null && !inviteButton.hidden) {
    invitationId = suggestion?.id ?? null;
    inviteButton.hidden = !suggestion;
    if (suggestion) inviteButton.textContent = suggestion.label;
  }
}
function draw(visibleTime) {
  g.save();
  g.translate(-Math.round(camera.x),-Math.round(camera.y));
  drawRoom(g,room);
  for (const id of orderAt(lamb.y)) {
    if (id === 'lamb') {
      lambShadow(g,lamb);
      drawLamb(g,sheet,lamb);
    } else drawScenery(g,id,room,visibleTime);
  }
  g.restore();
}
function frame(now) {
  const dt = Math.min(.035,(now-(previous??now))/1000);
  previous = now;
  time += dt;
  if (debug) step(lamb,dt);
  else behavior.update(dt);
  follow(camera,lamb,view,dt,behavior.focus);
  draw(reducedMotion.matches ? 0 : time);
  positionInterface();
  requestAnimationFrame(frame);
}
if (observation) {
  globalThis.jornadaObservation = () => ({
    time, mode:behavior.mode, camera:{...camera}, view:{...view},
    lamb:{x:lamb.x,y:lamb.y,pose:lamb.pose,face:lamb.face}, events:observation.slice()
  });
}
resize();
requestAnimationFrame(frame);
</script>
